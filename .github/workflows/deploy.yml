name: Verify and deploy portfolio with GitHub Pages Jekyll

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    permissions:
      contents: read
      pages: write
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Lighthouse CI
        run: npm install --global @lhci/cli@0.16.x

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Set up Python test environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Run complete source, type, build, and browser verification
        run: npm run verify

      - name: Run Lighthouse audits on the full site and recruiter view
        run: lhci autorun

      # Compile React and TypeScript with Vite before handing static output to Jekyll.
      # Jekyll packages dist/ for GitHub Pages; it does not compile the application.
      - name: Add GitHub Pages Jekyll configuration to the Vite output
        run: cp .github/jekyll/_config.yml dist/_config.yml

      - name: Package the Vite output with GitHub Pages Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./dist
          destination: ./_site
          verbose: true

      - name: Validate the Jekyll Pages artifact
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -d _site/assets
          test -s _site/King-Art-Pacumberto-CV.pdf
          test -s _site/King-Art-Pacumberto-Resume.pdf

          # Jekyll must leave the prebuilt Vite output untouched.
          touch _site/.nojekyll
          test -f _site/.nojekyll

          # Reject the raw source shell: Pages must serve compiled, hashed assets.
          grep -Eq '<script[^>]+src="/assets/index-[^"]+\\.js"' _site/index.html
          grep -Eq '<link[^>]+href="/assets/index-[^"]+\\.css"' _site/index.html
          ! grep -q 'src="/src/main.tsx"' _site/index.html

          js_asset="$(grep -oE '/assets/index-[^"]+\\.js' _site/index.html | head -n 1 | sed 's#^/##')"
          css_asset="$(grep -oE '/assets/index-[^"]+\\.css' _site/index.html | head -n 1 | sed 's#^/##')"
          test -n "$js_asset" && test -s "_site/$js_asset"
          test -n "$css_asset" && test -s "_site/$css_asset"

      - name: Save private Lighthouse reports to the workflow run
        if: always() && hashFiles('.lighthouseci/reports/**/*.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          retention-days: 14

      - name: Upload Jekyll-packaged Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    needs: verify-and-package
    steps:
      - name: Deploy verified Jekyll Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
